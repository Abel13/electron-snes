<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Demo cover</title>
  <desc id="desc">A cyan signal orbiting a warm star in a deep blue field.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#153b68"/>
      <stop offset="0.55" stop-color="#071629"/>
      <stop offset="1" stop-color="#020711"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b44cff"/>
      <stop offset="0.5" stop-color="#3288ff"/>
      <stop offset="1" stop-color="#16e5dc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="840" rx="36" fill="url(#space)"/>
  <g fill="#d7faff" opacity=".7">
    <circle cx="82" cy="180" r="3"/><circle cx="510" cy="142" r="2"/>
    <circle cx="462" cy="330" r="4"/><circle cx="125" cy="412" r="2"/>
    <circle cx="535" cy="610" r="3"/><circle cx="74" cy="690" r="4"/>
  </g>
  <circle cx="300" cy="420" r="78" fill="#ffcf61" opacity=".95"/>
  <ellipse cx="300" cy="420" rx="210" ry="92" fill="none" stroke="url(#signal)" stroke-width="14" transform="rotate(-18 300 420)"/>
  <circle cx="484" cy="354" r="24" fill="#20ded9" stroke="#d7ffff" stroke-width="7"/>
  <path d="M170 720h260" stroke="#28d8d2" stroke-width="3" opacity=".5"/>
  <text x="300" y="112" fill="#f4f7ff" font-family="sans-serif" font-size="66" font-weight="700" letter-spacing="8" text-anchor="middle">ORBIT</text>
  <text x="300" y="770" fill="#8eb9d8" font-family="sans-serif" font-size="24" letter-spacing="9" text-anchor="middle">REFERENCE DEMO</text>
</svg>
