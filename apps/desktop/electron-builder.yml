appId: org.pixelcore.desktop
productName: PixelCore
copyright: Copyright (c) 2026 PixelCore contributors

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - package.json
  - '!dist/**/*.d.ts'
  - '!dist/**/*.d.ts.map'
  - '!dist/**/*.js.map'
  - '!dist/**/*.test.js'
  - '!dist/.tsbuildinfo'
  - '!node_modules/@platform/**/.turbo/**/*'
  - '!node_modules/@platform/**/scripts/**/*'
  - '!node_modules/@platform/**/src/**/*'
  - '!node_modules/@platform/**/vendor/**/*'
  - '!node_modules/@platform/**/*.tsbuildinfo'
  - '!node_modules/@platform/**/dist/**/*.d.ts'
  - '!node_modules/@platform/**/dist/**/*.d.ts.map'
  - '!node_modules/@platform/**/dist/**/*.js.map'
  - '!node_modules/@platform/**/dist/**/*.test.js'

asar: true
asarUnpack:
  - node_modules/@platform/plugin-emulator-sameboy/wasm/**/*
  - node_modules/@platform/plugin-emulator-mgba/wasm/**/*

win:
  icon: build/icon.ico
  target:
    - arch:
        - x64
      target: nsis

nsis:
  artifactName: PixelCore-${version}-Windows-${arch}-Setup.${ext}

mac:
  artifactName: PixelCore-${version}-macOS-universal.${ext}
  category: public.app-category.games
  hardenedRuntime: true
  icon: assets/brand/pixelcore-icon.png
  target:
    - arch:
        - universal
      target: dmg
    - arch:
        - universal
      target: zip

dmg:
  iconSize: 128
  title: PixelCore ${version}

linux:
  artifactName: PixelCore-${version}-Linux-${arch}.${ext}
  category: Game
  executableName: pixelcore
  icon: assets/brand/pixelcore-icon.png
  maintainer: PixelCore contributors
  syncDesktopName: true
  target:
    - arch:
        - x64
      target: AppImage

publish:
  provider: github
  owner: Abel13
  repo: electron-snes
  releaseType: prerelease
  channel: beta
